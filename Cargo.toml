[workspace]
resolver = "2"
members = [
    # Shared substrate — reused by v2 unchanged.
    "crates/course-seed",
    "crates/course-world",
    "crates/course-viz",
    # v2 pipeline, S0 -> S11. See docs/00-architecture.md.
    "crates/course-contracts",
    "crates/course-spec",
    "crates/course-primitives",
    "crates/course-skeleton",
    "crates/course-amplify",
    "crates/course-transforms",
    "crates/course-substrate",
    "crates/course-routing",
    "crates/course-earthmoving",
    "crates/course-layout",
    "crates/course-micro",
    "crates/course-zoning",
    "crates/course-validate",
    # Offline + tooling.
    "crates/course-calibration",
    "crates/course-cli",
    "crates/stage-lab",
    "crates/tile-lab",
    # --- ATTEMPT 4: network-first terrain (branch `network-first`).
    # Replaces S0-S4. Must not depend on the retired pipeline crates --
    # enforced by tools/no_old_deps.sh. See docs/network-first/README.md.
    "crates/course-draw",
    "crates/course-template",
    "crates/course-network",
    "crates/course-relief",
    "crates/course-fabric",
    "crates/course-water",
    "crates/course-lab",
    # --- ATTEMPT 5: the Sandhills archetype, built alone (branch `sandhills`).
    # May depend on course-world + course-seed ONLY -- not the retired pipeline
    # crates and not attempt 4's generator crates. Enforced by
    # tools/no_old_deps.sh. See docs/sandhills/README.md.
    "crates/course-sandhills",
    # Superseded by S1/S2; retained until the skeleton kernel lands.
    # See MIGRATION.md.
    "crates/course-framing",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
course-seed = { path = "crates/course-seed" }
course-world = { path = "crates/course-world" }
course-viz = { path = "crates/course-viz" }
course-contracts = { path = "crates/course-contracts" }
course-spec = { path = "crates/course-spec" }
course-primitives = { path = "crates/course-primitives" }
course-skeleton = { path = "crates/course-skeleton" }
course-amplify = { path = "crates/course-amplify" }
course-transforms = { path = "crates/course-transforms" }
course-substrate = { path = "crates/course-substrate" }
course-routing = { path = "crates/course-routing" }
course-earthmoving = { path = "crates/course-earthmoving" }
course-layout = { path = "crates/course-layout" }
course-micro = { path = "crates/course-micro" }
course-zoning = { path = "crates/course-zoning" }
course-validate = { path = "crates/course-validate" }
course-calibration = { path = "crates/course-calibration" }
course-framing = { path = "crates/course-framing" }
course-draw = { path = "crates/course-draw" }
course-template = { path = "crates/course-template" }
course-network = { path = "crates/course-network" }
course-relief = { path = "crates/course-relief" }
course-fabric = { path = "crates/course-fabric" }
course-water = { path = "crates/course-water" }
course-lab = { path = "crates/course-lab" }
course-sandhills = { path = "crates/course-sandhills" }
libm = "0.2"
eframe = { version = "0.31", features = ["wgpu"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: exact f64 parsing, so artifact JSON round-trips
# byte-identically (determinism invariant 1).
serde_json = { version = "1", features = ["float_roundtrip"] }
rand_core = "0.9"
rand_chacha = "0.9"
blake3 = "1"
getrandom = "0.3"

# The macro raster samples analytic primitives per cell — unoptimized builds
# are ~30x slower, so tests (and dev runs of the lab) build with opt.
[profile.dev]
opt-level = 2

[profile.test]
opt-level = 2
