[workspace]
resolver = "2"
members = ["crates/course-seed", "crates/course-spec"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
course-seed = { path = "crates/course-seed" }
course-spec = { path = "crates/course-spec" }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: exact f64 parsing, so artifact JSON round-trips
# byte-identically (determinism invariant 1).
serde_json = { version = "1", features = ["float_roundtrip"] }
rand_core = "0.9"
rand_chacha = "0.9"
blake3 = "1"
getrandom = "0.3"
