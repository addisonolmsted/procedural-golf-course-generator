# Terrain-characterization metrics — single source of truth for resolution,
# clip geometry, thresholds, detrend policy, and the SHARED axes that make the
# per-course distribution vectors directly comparable.
#
# NOTE on resolution (important, project-specific): the reference atlas is not a
# set of GeoTIFFs — each course is a 256x256 elevation grid packed over its
# survey extent (~1.3-2 km), so the NATIVE cell size is ~5-8 m and non-square.
# The task suggested starting at 3 m; on this data 3 m is pure interpolation
# (adds no real detail) and 4x slower, so the default common grid is 6 m — at
# or just below native. Set `common_cell_size_m: 3.0` to follow the task value;
# `reliable_wavelength_min_m` then guards the spectral/roughness fits from the
# upsampled (unreliable) band. Every metric records the course's native cell.

seed: 12345

data:
  # per-course JSON records produced by tools/parkland_atlas (200 courses)
  cache_dir: "../../parkland_atlas/out/cache"
  grid_n: 256                 # native atlas grid is grid_n x grid_n

resample:
  common_cell_size_m: 6.0     # target square cell for ALL courses + synthetic
  order: 1                    # bilinear for elevation
  mask_order: 0               # nearest for masks

clip:
  variants: ["course_extent", "fairway_corridor"]
  extent_buffer_m: 60.0       # buffer around the convex hull of hole vertices
  corridor_buffer_m: 50.0     # buffer around the OSM hole centerlines

mask:
  # water/out-of-bounds cells: excluded from slope/roughness/curvature/spectrum
  # and hydrology; hypsometry & relief use land (valid) cells only.
  exclude_water: true

detrend:
  method: "quadratic"         # planar | quadratic — removed before spectrum,
                              # variogram, roughness. Curvature uses raw second
                              # derivatives (invariant to a planar trend).

slope:
  flat_deg: 3.0
  steep_deg: 15.0
  hist_min_deg: 0.0
  hist_max_deg: 45.0
  hist_step_deg: 1.5          # -> 30 bins on [0, 45]

spectrum:
  reliable_wavelength_min_m: 14.0   # ignore finer than this (~2x native)
  midband_wavelength_m: [30.0, 400.0]   # wavelength band for the beta fit
  highfreq_cutoff_m: 30.0           # highfreq_energy_frac = power at wl < this
  psd_n_axis: 48                    # shared radial PSD axis length
  psd_wavelength_m: [14.0, 900.0]   # shared PSD wavelength axis (log-spaced)

variogram:
  n_lags: 40
  max_lag_m: 600.0                  # shared lag axis: 0 .. max_lag_m
  n_pairs: 300000                   # random pairs sampled (seeded)
  model: "exponential"              # exponential | spherical

roughness_windows_m:
  small: 30.0
  mid: 100.0
  large: 300.0

local_relief_windows_m: [100.0, 200.0]

landform:
  # spatial ORGANIZATION of texture (where the roughness lives) + landform
  # coherence — the axes behind the qualitative "choppy / fragmented / uniform"
  # gaps. Windows chosen so each measures a distinct scale: roughness field at
  # 30 m (bank/mound), clustering lag 60 m (2x window), block variance 350 m,
  # extrema smoothing sigma 12 m (kills stipple, keeps 25-100 m forms), TPI
  # valleys at 60 m (fragmentation count) and 120 m (trough shape).
  rough_window_m: 30.0
  moran_lag_m: 60.0
  block_m: 350.0
  extrema_sigma_m: 12.0
  tpi_radius_m: [60.0, 120.0]
  tpi_k: 0.7
  tpi_min_area_m2: 900.0

hydrology:
  accum_area_threshold_m2: 60000.0  # channel-initiation drainage area
  flow: "d8"

hypsometric:
  n_curve: 21                       # shared fraction axis 0..1

report:
  hillshade_azimuth_deg: 315.0
  hillshade_altitude_deg: 45.0
  dpi: 110
